name: Build and Release NovaCare

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Code Syntax
        run: |
          python -m compileall -q .

      - name: Build NovaCare Standalone Executable
        run: |
          python scripts/build_exe.py

      - name: Build NovaCare Setup Wizard Installer
        run: |
          python scripts/build_installer.py

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION | Select-Object -First 1).Trim()
          $zipName = "NovaCare_v${ver}_Portable.zip"
          Compress-Archive -Path NovaCare.exe, CHANGELOG.md, README.md, LICENSE, app.manifest -DestinationPath $zipName -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-Windows-Builds
          path: |
            NovaCare_Setup.exe
            NovaCare.exe
            NovaCare_v*_Portable.zip
          retention-days: 14

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NovaCare_Setup.exe
            NovaCare.exe
            NovaCare_v*_Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
